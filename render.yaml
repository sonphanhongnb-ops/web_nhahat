# ==========================================================
#  Render Blueprint — THỨC by SEASOUND (BẢN MIỄN PHÍ)
#  Render.com → New → Blueprint → chọn repo này.
#
#  Gói Free: KHÔNG có ổ đĩa lưu trữ → dữ liệu người dùng nhập
#  (đơn đặt vé, đăng ký, chỉnh sửa admin, ảnh upload) sẽ RESET
#  mỗi khi service khởi động lại. Nhưng toàn bộ NỘI DUNG website
#  (trang, bài viết, lịch diễn, giá vé) TỰ TẠO LẠI khi khởi động,
#  nên trang công khai luôn đầy đủ.
#
#  Muốn giữ dữ liệu vĩnh viễn → nâng lên gói Starter và thêm khối
#  "disk" (xem hướng dẫn ở cuối file).
# ==========================================================
services:
  - type: web
    name: thuc-seasound
    runtime: node
    plan: free
    region: singapore             # gần Việt Nam nhất
    buildCommand: npm install
    startCommand: node --experimental-sqlite server.js
    healthCheckPath: /robots.txt
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_NO_WARNINGS
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: MAX_UPLOAD_MB
        value: "8"
      - key: SESSION_SECRET
        generateValue: true       # Render tự sinh & giữ cố định
      # ⚠ Sau khi có URL Render cấp, sửa lại giá trị này trong Dashboard:
      - key: SITE_URL
        value: https://thuc-seasound.onrender.com
      # Tài khoản quản trị tạo ở lần chạy đầu — ĐỔI MẬT KHẨU ngay sau khi vào
      - key: SEED_ADMIN_EMAIL
        value: admin@seasound.com
      - key: SEED_ADMIN_PASSWORD
        sync: false               # tự nhập trong Dashboard, không lưu vào repo

# ----------------------------------------------------------
#  NÂNG CẤP GIỮ DỮ LIỆU VĨNH VIỄN (gói Starter ~$7/tháng):
#  Đổi "plan: free" -> "plan: starter", rồi thêm vào service:
#
#    disk:
#      name: data
#      mountPath: /data
#      sizeGB: 1
#
#  và thêm 2 biến:
#    - key: DB_FILE
#      value: /data/app.db
#    - key: UPLOAD_DIR
#      value: /data/uploads
# ----------------------------------------------------------
